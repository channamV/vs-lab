; VS Lab build of Freematics Telelogger for the Freematics ONE+ Model H (SIM7670 modem).
; Upstream's file had a single [env:esp32dev] and no settings; ours sets everything with build flags so
; config.h stays as upstream wrote it. Setup and flashing: docs/freematics-setup.md.
;
;   pio run -e bench -t upload      bench test (OBD off: no vehicle needed)
;   pio run -e vehicle -t upload    in a vehicle or machine (OBD on)
;   pio run -e bench-nobt -t upload early Wi-Fi tests only: Bluetooth off to free memory. Deployed devices need
;                                   Bluetooth (beacons, phone app); see ../README.md "Bluetooth must stay"
;   pio device monitor              the device's log (115200 baud)
;
; Optional Wi-Fi (tried before cellular): set these in the terminal before building, never in this file:
;   PowerShell:  $env:VSLAB_WIFI_SSID="MyWifi"; $env:VSLAB_WIFI_PASSWORD="secret"
; Left unset, the device uses cellular only.

[platformio]
src_dir = .
default_envs = bench

[env]
; Arduino-ESP32 2.x. Telelogger uses ESP-IDF 4 headers (apps/sntp/sntp.h, esp_spi_flash.h) that are gone
; from the 3.x line, so stay on platform 6.
platform = espressif32@^6
board = esp-wrover-kit
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../libraries
build_flags =
  ; Model H has PSRAM: hours of data are buffered while there's no signal.
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCONFIG_BOARD_HAS_PSRAM=1
  ; Our platform (production). The device posts to https://<host>/hub/api/...
  -DCONFIG_SERVER_HOST=\"vs-lab-platform-tpj9.vercel.app\"
  -DCONFIG_SERVER_PORT=443
  -DCONFIG_SERVER_PROTOCOL=PROTOCOL_HTTPS_POST
  ; Soracom plan01s
  -DCONFIG_CELL_APN=\"soracom.io\"
  ; GPS on the SIM7670G modem (the Model H has no separate GPS chip: GNSS_STANDALONE logged "GNSS:NO"),
  ; motion sensor, data also logged to the microSD card
  -DCONFIG_GNSS=GNSS_CELLULAR
  -DCONFIG_ENABLE_MEMS=1
  -DCONFIG_STORAGE=STORAGE_SD
  ; Wi-Fi from the environment (see above); empty = cellular only
  -DCONFIG_ENABLE_WIFI=1
  -DCONFIG_WIFI_SSID=\"${sysenv.VSLAB_WIFI_SSID}\"
  -DCONFIG_WIFI_PASSWORD=\"${sysenv.VSLAB_WIFI_PASSWORD}\"

[env:bench]
build_flags =
  ${env.build_flags}
  -DCONFIG_ENABLE_OBD=0

[env:vehicle]
build_flags =
  ${env.build_flags}
  -DCONFIG_ENABLE_OBD=1

[env:bench-nobt]
build_flags =
  ${env.build_flags}
  -DCONFIG_ENABLE_OBD=0
  -DCONFIG_ENABLE_BLE=0
